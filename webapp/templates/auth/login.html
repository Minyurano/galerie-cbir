{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card card shadow-sm">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <div class="auth-logo"><i class="bi bi-images"></i></div>
        <h1 class="h4 mb-1">Galerie CBIR</h1>
        <p class="text-muted small mb-0">Recherche d'images par le contenu avec retour de pertinence</p>
      </div>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label">Nom d'utilisateur ou e-mail</label>
          <input class="form-control" name="username" value="{{ username or '' }}" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Mot de passe</label>
          <input class="form-control" type="password" name="password" required>
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" name="remember" id="remember">
          <label class="form-check-label" for="remember">Rester connecté</label>
        </div>
        <button class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right"></i> Se connecter</button>
      </form>
      <p class="text-center small mt-3 mb-0">Pas encore de compte ? <a href="{{ url_for('auth.register') }}">Créer un compte</a></p>
    </div>
  </div>
</div>
{% endblock %}
